<!DOCTYPE html>
<!-- Kids site shell: edit this file. build_kids_site.py copies it to website-kids/index.html. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playbox</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6c63ff">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
// ── LOCKDOWN: must run BEFORE any other scripts ──
// Force all shadow DOM to be "open" so we can reach inside Twitter's widget
// to sandbox its iframe. Without this, Twitter uses closed shadow DOM and
// we can't touch the iframe at all.
(function() {
  const _attachShadow = Element.prototype.attachShadow;
  Element.prototype.attachShadow = function(init) {
    return _attachShadow.call(this, Object.assign({}, init, { mode: 'open' }));
  };

  // Block ALL popups globally — nothing should open a new window
  window.open = function() { return null; };

  // Prevent the page itself from navigating away
  window.addEventListener('beforeunload', function(e) {
    e.preventDefault();
    e.returnValue = '';
    return '';
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --bg: #0f0f13;
  --surface: #1a1a22;
  --surface-hover: #24242f;
  --surface-active: #2e2e3a;
  --border: #2a2a36;
  --text: #e8e6f0;
  --text-dim: #9896a8;
  --accent: #6c63ff;
  --accent-glow: rgba(108,99,255,0.25);
  --green: #4ade80;
  --orange: #fb923c;
  --red: #f87171;
  --radius: 12px;
  --radius-sm: 8px;
}

html { font-size: 16px; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Top Bar ── */
.topbar {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px;
  background: rgba(15,15,19,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.topbar h1 {
  font-family: 'Fraunces', serif;
  font-size: 1.35rem;
  letter-spacing: -0.02em;
  white-space: nowrap;
}
.topbar h1 span { color: var(--accent); }
.search-box {
  flex: 1; max-width: 400px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 8px 12px 8px 36px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--text);
  font: inherit; font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box::before {
  content: '⌕';
  position: absolute; left: 12px; top: 10px;
  color: var(--text-dim); font-size: 1.1rem;
  pointer-events: none;
}
.search-pills {
  display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap;
}
.search-pill {
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  user-select: none;
  transition: all 0.15s;
  font-family: inherit;
}
.search-pill.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.search-pill:hover:not(.active) {
  border-color: var(--text-dim);
}
.spacer { flex: 1; }
.kid-toggle {
  display: flex; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
  font-size: 0.85rem; color: var(--text-dim);
  white-space: nowrap;
}
.kid-toggle input { display: none; }
.kid-toggle .switch {
  width: 40px; height: 22px;
  background: var(--surface-active);
  border-radius: 11px;
  position: relative;
  transition: background 0.25s;
}
.kid-toggle .switch::after {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--text-dim);
  top: 3px; left: 3px;
  transition: transform 0.25s, background 0.25s;
}
.kid-toggle input:checked + .switch {
  background: var(--green);
}
.kid-toggle input:checked + .switch::after {
  transform: translateX(18px);
  background: #fff;
}

/* ── Layout ── */
.container { padding: 24px 20px 60px; max-width: 1200px; margin: 0 auto; }

/* ── Category Grid ── */
.cat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 32px;
}
.cat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 14px;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s;
  text-align: center;
}
.cat-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
  box-shadow: 0 4px 20px var(--accent-glow);
}
.cat-card.active {
  border-color: var(--accent);
  background: var(--surface-hover);
  box-shadow: 0 0 0 2px var(--accent-glow);
}
.cat-card .icon { font-size: 1.8rem; margin-bottom: 6px; }
.cat-card .name { font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
.cat-card .count { font-size: 0.8rem; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.cat-card.hidden { display: none; }

/* ── Section Header ── */
.section-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 20px;
}
.section-header h2 {
  font-family: 'Fraunces', serif;
  font-size: 1.5rem;
  letter-spacing: -0.02em;
}
.section-header .badge {
  background: var(--surface-active);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.8rem;
  color: var(--text-dim);
}
.back-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 6px 14px;
  font: inherit; font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.15s;
}
.back-btn:hover { background: var(--surface-hover); }

/* ── Item Grid ── */
.item-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.item-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.2s;
}
.item-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}
.item-thumb {
  width: 100%;
  aspect-ratio: 16/9;
  background: var(--surface-active);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.item-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.item-thumb .placeholder {
  font-size: 2.5rem;
  opacity: 0.3;
}
.item-thumb .play-badge {
  position: absolute;
  bottom: 8px; right: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 4px;
}
.item-thumb .duration {
  position: absolute;
  bottom: 8px; left: 8px;
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 0.7rem;
  padding: 2px 6px;
  border-radius: 4px;
}
.item-fav-star {
  position: absolute;
  top: 6px;
  right: 6px;
  z-index: 2;
  width: 32px;
  height: 32px;
  border: none;
  border-radius: 8px;
  background: rgba(0,0,0,0.55);
  color: var(--text-dim);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.item-fav-star:hover { color: #fff; }
.item-fav-star.on { color: var(--orange); }
.item-body { padding: 12px 14px; }
.item-body .text {
  font-size: 0.85rem;
  line-height: 1.45;
  color: var(--text);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 8px;
}
.item-body .meta {
  display: flex; justify-content: space-between;
  font-size: 0.75rem; color: var(--text-dim);
}
.item-body .tags {
  display: flex; gap: 4px; flex-wrap: wrap;
  margin-top: 6px;
}
.item-body .tag {
  background: var(--surface-active);
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 0.65rem;
  color: var(--text-dim);
}

/* ── Player Modal ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  max-width: 800px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-close {
  position: absolute; top: 16px; right: 16px;
  background: rgba(0,0,0,0.6);
  border: none;
  color: #fff;
  font-size: 1.5rem;
  width: 36px; height: 36px;
  border-radius: 50%;
  cursor: pointer;
  z-index: 210;
  display: flex; align-items: center; justify-content: center;
}
.modal #modalPlayer {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 200px;
  justify-content: center;
}
/* Library videos differ in shape (16:9 and 2.35:1 cinematic), so size the player
   by its box rather than the file's intrinsic pixels — a 1694px-wide video would
   otherwise overflow the 800px modal. */
.modal #modalPlayer video {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
  max-height: 70vh;
  object-fit: contain;
  background: #000;
}
.modal #modalPlayer .twitter-tweet-rendered,
.modal #modalPlayer twitter-widget {
  margin: 0 auto !important;
  max-width: 100% !important;
}
.embed-loading {
  text-align: center;
  color: var(--text-dim);
  padding: 40px 20px;
}
.embed-loading .spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.embed-fallback {
  text-align: center;
  padding: 30px 20px;
  color: var(--text-dim);
}
.embed-fallback a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.embed-fallback a:hover { text-decoration: underline; }
.modal-info { padding: 16px 20px; }
.modal-title-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}
.modal-fav-btn {
  flex-shrink: 0;
  background: transparent;
  border: none;
  color: var(--text-dim);
  font-size: 1.35rem;
  line-height: 1;
  cursor: pointer;
  padding: 0 2px 0 0;
}
.modal-fav-btn:hover { color: var(--text); }
.modal-fav-btn.on { color: var(--orange); }
.modal-info .title {
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.5;
  flex: 1;
  margin-bottom: 0;
}
.modal-info .author {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.modal-info .original-link:empty { display: none; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
#modal.lucky-dip-immersive {
  padding: 0;
  align-items: stretch;
  justify-content: stretch;
  min-height: 100dvh;
  background: #000;
}
#modal.lucky-dip-immersive .modal {
  max-width: 100%;
  width: 100%;
  min-height: 100dvh;
  max-height: 100dvh;
  height: 100dvh;
  border-radius: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #0a0a0f;
}
#modal.lucky-dip-immersive #modalPlayer {
  flex: 1;
  min-height: 0;
  padding: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: #000;
  align-items: stretch;
  justify-content: center;
}
#modal.lucky-dip-immersive #modalPlayer video {
  flex: 1;
  min-height: 0;
  width: 100%;
  object-fit: contain;
  border-radius: 0;
}
/* ── Install prompt ──
   A dismissible card, not a modal: it must never block a child mid-video, so it
   sits out of the way and hides whenever the player is open. */
.install-card {
  position: fixed;
  z-index: 190;
  left: 50%;
  bottom: max(16px, env(safe-area-inset-bottom));
  transform: translate(-50%, 140%);
  width: min(440px, calc(100vw - 24px));
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 18px 40px rgba(0,0,0,0.5), 0 0 0 1px var(--accent-glow);
  opacity: 0;
  pointer-events: none;
  transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
}
.install-card.show {
  transform: translate(-50%, 0);
  opacity: 1;
  pointer-events: auto;
}
.install-card img {
  width: 46px;
  height: 46px;
  border-radius: 11px;
  flex-shrink: 0;
}
.install-copy { flex: 1; min-width: 0; }
.install-copy strong {
  display: block;
  font-size: 0.95rem;
  color: var(--text);
  line-height: 1.25;
}
.install-copy span {
  display: block;
  font-size: 0.8rem;
  color: var(--text-dim);
  line-height: 1.35;
  margin-top: 2px;
}
.install-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.install-yes {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px 15px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  min-height: 42px;
}
.install-yes:hover { filter: brightness(1.08); }
.install-no {
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 1.35rem;
  line-height: 1;
  cursor: pointer;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  min-height: 42px;
}
.install-no:hover { color: var(--text); background: var(--surface-hover); }
/* iOS gets instructions instead of a button — Safari has no install API. */
.install-card.ios .install-yes { display: none; }
.install-ios-hint { display: none; }
.install-card.ios .install-ios-hint { display: inline; }
@media (max-width: 520px) {
  .install-card { align-items: flex-start; flex-wrap: wrap; }
  .install-actions { width: 100%; justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) {
  .install-card { transition: opacity 0.2s ease; transform: translate(-50%, 0); }
}

/* ── Offline / saved episodes ── */
.offline-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 12px 20px 4px;
}
.offline-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface-hover);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 14px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  min-height: 42px;
}
.offline-btn:hover:not(:disabled) { background: var(--surface-active); }
.offline-btn:disabled { opacity: 0.65; cursor: default; }
.offline-btn.saved { border-color: var(--green); color: var(--green); }
.offline-note {
  font-size: 0.78rem;
  color: var(--text-dim);
}
.offline-progress {
  flex: 1 1 140px;
  min-width: 120px;
  height: 8px;
  border-radius: 4px;
  background: var(--surface-active);
  overflow: hidden;
  display: none;
}
.offline-progress.on { display: block; }
.offline-progress > i {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.2s ease;
}
.saved-badge {
  position: absolute;
  left: 8px;
  bottom: 8px;
  background: rgba(0,0,0,0.72);
  color: var(--green);
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 700;
  padding: 3px 8px;
  pointer-events: none;
}
.offline-banner {
  display: none;
  background: var(--orange);
  color: #1a1a22;
  font-weight: 600;
  text-align: center;
  padding: 7px 12px;
  font-size: 0.86rem;
}
body.is-offline .offline-banner { display: block; }

/* Fullscreen lifts the video into the browser's top layer, where it is no longer
   a flex item — `flex: 1` stops applying and the height collapses to auto, so a
   2.35:1 episode ends up a band across the top. Force it to fill the screen. */
#modalPlayer video:fullscreen,
#modalPlayer video:-webkit-full-screen {
  width: 100% !important;
  height: 100% !important;
  max-width: none !important;
  max-height: none !important;
  object-fit: contain !important;
  background: #000;
}
#modal.lucky-dip-immersive .no-video {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#modal.lucky-dip-immersive .modal-info {
  padding: 10px 16px 12px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  max-height: 30vh;
  overflow-y: auto;
}
.lucky-dip-bar {
  display: none;
  flex-shrink: 0;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 12px 16px;
  background: linear-gradient(180deg, #12121a, #0f0f13);
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
#modal.lucky-dip-immersive .lucky-dip-bar { display: flex; }
#modal.lucky-dip-immersive .modal-close { top: 10px; right: 10px; z-index: 220; }
.lucky-dip-bar button {
  font: inherit;
  font-size: 1rem;
  font-weight: 600;
  min-height: 48px;
  min-width: 120px;
  padding: 0 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.lucky-dip-bar .lucky-back { background: var(--surface); color: var(--text); }
.lucky-dip-bar .lucky-back:hover:not(:disabled) { background: var(--surface-hover); }
.lucky-dip-bar .lucky-back:disabled { opacity: 0.45; cursor: not-allowed; }
.lucky-dip-bar .lucky-next { background: var(--accent); color: #fff; border-color: var(--accent); }
.lucky-dip-bar .lucky-next:hover { filter: brightness(1.08); }
.lucky-dip-bar .lucky-done { background: transparent; color: var(--text-dim); }
.lucky-dip-fallback-hint {
  display: none;
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-dim);
  padding: 0 12px 8px;
  width: 100%;
  flex-basis: 100%;
  order: -1;
}
#modal.lucky-dip-immersive .lucky-dip-fallback-hint.show { display: block; }
#luckyPreload {
  position: fixed;
  left: 0; top: 0;
  width: 0; height: 0;
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
}

/* ── Empty State ── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-state .big-icon { font-size: 3rem; margin-bottom: 12px; }

/* ── Responsive ── */
@media (max-width: 700px) {
  .topbar {
    flex-wrap: wrap;
    padding: 10px 14px;
    gap: 8px;
  }
  .topbar h1 { font-size: 1.05rem; flex: 0 0 auto; }
  .search-box { order: 3; flex: 1 1 100%; max-width: 100%; }
  .search-box input { padding: 10px 12px 10px 36px; font-size: 0.95rem; }
  .spacer { display: none; }
  .kid-toggle { margin-left: auto; font-size: 0.8rem; }
  .search-pills { gap: 6px; margin-top: 6px; }
  .search-pill { font-size: 0.72rem; padding: 4px 10px; border-radius: 12px; }
  .container { padding: 16px 12px 40px; }
  .cat-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .cat-card { padding: 14px 10px; }
  .cat-card .icon { font-size: 1.55rem; margin-bottom: 4px; }
  .cat-card .name { font-size: 0.85rem; }
  .item-grid { grid-template-columns: 1fr; gap: 12px; }
  .section-header { flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
  .section-header h2 { font-size: 1.25rem; }
  .modal-overlay { padding: 10px; }
  .modal { max-width: 100%; }
  .modal-info { padding: 14px 16px; }
}
@media (max-width: 400px) {
  .lucky-dip-bar button { min-width: 96px; font-size: 0.9rem; padding: 0 14px; }
  .cat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="offline-banner" id="offlineBanner">Offline — saved episodes still play</div>

<div class="install-card" id="installCard" role="dialog" aria-modal="false" aria-labelledby="installTitle" hidden>
  <img src="icons/icon-192.png" alt="" width="46" height="46">
  <div class="install-copy">
    <strong id="installTitle">Add Playbox to your home screen</strong>
    <span>Opens like an app, and lets you save episodes to watch without wifi.<span class="install-ios-hint"> Tap Share, then “Add to Home Screen”.</span></span>
  </div>
  <div class="install-actions">
    <button type="button" class="install-yes" id="installYes" onclick="acceptInstall()">Install</button>
    <button type="button" class="install-no" onclick="dismissInstall()" aria-label="Not now">×</button>
  </div>
</div>

<div class="topbar">
  <h1><span>▶</span> Playbox</h1>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search bookmarks…" autocomplete="off">
    <div class="search-pills">
      <button class="search-pill active" data-scope="text" onclick="toggleScope(this)">Text</button>
      <button class="search-pill active" data-scope="author" onclick="toggleScope(this)">Author</button>
      <button class="search-pill" data-scope="tags" onclick="toggleScope(this)">Tags</button>
      <button class="search-pill active" data-scope="whole" onclick="toggleScope(this)">Whole word</button>
    </div>
  </div>
  <div class="spacer"></div>
  <span id="kidMode" style="display:none"></span>
</div>

<div class="container">
  <!-- Category Grid -->
  <div id="catGrid" class="cat-grid"></div>

  <!-- Items View -->
  <div id="itemsView" style="display:none">
    <div class="section-header">
      <button class="back-btn" onclick="showCategories()">← Back</button>
      <h2 id="sectionTitle"></h2>

    </div>
    <div id="itemGrid" class="item-grid"></div>
    <div id="emptyState" class="empty-state" style="display:none">
      <div class="big-icon">🔍</div>
      <p>No bookmarks match your search.</p>
    </div>
  </div>
</div>

<!-- Player Modal -->
<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div id="luckyDipAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <video id="luckyPreload" muted playsinline preload="none" tabindex="-1" aria-hidden="true"></video>
  <button class="modal-close" type="button" onclick="closeModal()" aria-label="Close">×</button>
  <div class="modal" id="modalBox">
    <div id="modalPlayer"></div>
    <div class="offline-row" id="offlineRow" style="display:none">
      <button type="button" class="offline-btn" id="offlineBtn" onclick="toggleOfflineForCurrent()"></button>
      <div class="offline-progress" id="offlineProgress"><i></i></div>
      <span class="offline-note" id="offlineNote"></span>
    </div>
    <div id="luckyDipBar" class="lucky-dip-bar">
      <p id="luckyDipFallbackHint" class="lucky-dip-fallback-hint" role="status"></p>
      <button type="button" class="lucky-back" id="luckyBack" onclick="luckyDipBack()" aria-label="Lucky dip: go back">Back</button>
      <button type="button" class="lucky-next" id="luckyNext" onclick="luckyDipNext()" aria-label="Lucky dip: next random">Next</button>
      <button type="button" class="lucky-done" id="luckyDone" onclick="closeModal()" aria-label="Lucky dip: done">Done</button>
    </div>
    <div class="modal-info">
      <div class="modal-title-row">
        <button type="button" class="modal-fav-btn" id="modalFavBtn" onclick="toggleFavouriteModal()" aria-label="Toggle favourite">☆</button>
        <div class="title" id="modalTitle"></div>
      </div>
      <div class="author" id="modalAuthor"></div>
      <div class="original-link" id="modalLink"></div>
    </div>
  </div>
</div>

<script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
<script src="data.js"></script>
<script>
const { categories, items } = SITE_DATA;

const LS_FAV = 'bookmarksLibKids:favourites:v1';
const LS_RECENT = 'bookmarksLibKids:recent:v1';
const RECENT_CAP = 80;
const KID_BUILD = SITE_DATA.kid_build === true;
const LUCKY_RECENT_MS = 4000;

let currentCat = null;
let kidMode = false;
let searchQuery = '';
let modalOpenItemId = null;
const searchScopes = { text: true, author: true, tags: false, whole: true };

let luckyDipActive = false;
let luckyHistory = [];
let luckyHistoryIndex = 0;
let luckyDipRecentTimer = null;

const $ = id => document.getElementById(id);
const byNormUrl = new Map();

function normUrl(raw) {
  if (!raw || typeof raw !== 'string') return '';
  const trimmed = raw.trim();
  if (!trimmed) return '';
  try {
    const u = new URL(trimmed);
    u.search = '';
    u.hash = '';
    let host = u.hostname.toLowerCase();
    if (host === 'twitter.com' || host === 'www.twitter.com') u.hostname = 'x.com';
    else if (host === 'mobile.twitter.com' || host === 'm.twitter.com') u.hostname = 'x.com';
    else if (host === 'www.x.com') u.hostname = 'x.com';
    let out = u.toString();
    if (out.endsWith('/') && u.pathname !== '/') out = out.slice(0, -1);
    return out;
  } catch {
    return '';
  }
}

function rebuildUrlIndex() {
  byNormUrl.clear();
  for (const i of items) {
    const k = normUrl(i.url);
    if (k) byNormUrl.set(k, i);
  }
}
rebuildUrlIndex();

function loadJson(key, fallback) {
  try {
    const s = localStorage.getItem(key);
    if (s == null) return fallback;
    return JSON.parse(s);
  } catch {
    return fallback;
  }
}

function saveJson(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) {
    console.warn('localStorage save failed', key, e);
  }
}

function pruneStoredUserData() {
  const favsRaw = loadJson(LS_FAV, []);
  const favArr = Array.isArray(favsRaw) ? favsRaw : [];
  const favKeys = favArr.map(normUrl).filter(Boolean);
  const nextFav = [];
  const seenF = new Set();
  let favChanged = !Array.isArray(favsRaw) || favArr.length !== favKeys.length;
  for (const k of favKeys) {
    if (!byNormUrl.has(k)) { favChanged = true; continue; }
    if (seenF.has(k)) { favChanged = true; continue; }
    seenF.add(k);
    nextFav.push(k);
  }
  if (nextFav.length !== favKeys.length) favChanged = true;

  const recentRaw = loadJson(LS_RECENT, []);
  const nextRecent = [];
  const seenR = new Set();
  let recentChanged = !Array.isArray(recentRaw);
  const arr = Array.isArray(recentRaw) ? recentRaw : [];
  for (const e of arr) {
    const k = normUrl(e && e.u);
    if (!k || !byNormUrl.has(k)) { recentChanged = true; continue; }
    if (seenR.has(k)) { recentChanged = true; continue; }
    seenR.add(k);
    nextRecent.push({ u: k, t: typeof e.t === 'number' ? e.t : Date.now() });
  }
  if (nextRecent.length !== arr.length) recentChanged = true;

  if (favChanged) saveJson(LS_FAV, nextFav);
  if (recentChanged) saveJson(LS_RECENT, nextRecent);
}

function getFavouriteKeys() {
  pruneStoredUserData();
  return loadJson(LS_FAV, []);
}

function isFavourite(url) {
  const k = normUrl(url);
  if (!k) return false;
  return getFavouriteKeys().includes(k);
}

function toggleFavourite(url) {
  const k = normUrl(url);
  if (!k) return;
  pruneStoredUserData();
  let favs = loadJson(LS_FAV, []);
  const idx = favs.indexOf(k);
  if (idx >= 0) favs.splice(idx, 1);
  else favs.push(k);
  saveJson(LS_FAV, favs);
}

function recordRecent(url) {
  const k = normUrl(url);
  if (!k) return;
  pruneStoredUserData();
  let entries = loadJson(LS_RECENT, []);
  if (!Array.isArray(entries)) entries = [];
  entries = entries.filter(e => normUrl(e.u) !== k);
  entries.unshift({ u: k, t: Date.now() });
  if (entries.length > RECENT_CAP) entries = entries.slice(0, RECENT_CAP);
  saveJson(LS_RECENT, entries);
}

function getRecentKeysOrdered() {
  pruneStoredUserData();
  const entries = loadJson(LS_RECENT, []);
  if (!Array.isArray(entries)) return [];
  return entries.map(e => normUrl(e.u)).filter(Boolean);
}

function itemPassesKidMode(i) {
  if (!kidMode) return true;
  if (i.risque) return false;
  const cat = categories.find(c => c.slug === i.category);
  return cat && cat.kid_safe !== false;
}

function visibleCountFromUrlKeys(keys) {
  let list = keys.map(k => byNormUrl.get(k)).filter(Boolean);
  if (kidMode) list = list.filter(itemPassesKidMode);
  return list.length;
}

function toggleScope(el) {
  const scope = el.dataset.scope;
  searchScopes[scope] = !searchScopes[scope];
  el.classList.toggle('active', searchScopes[scope]);
  // Re-trigger search if there's a query
  if (searchQuery) $('searchInput').dispatchEvent(new Event('input'));
}

function matchesQuery(str, q) {
  if (!str) return false;
  if (searchScopes.whole) {
    try {
      return new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'i').test(str);
    } catch { return str.toLowerCase().includes(q.toLowerCase()); }
  }
  return str.toLowerCase().includes(q.toLowerCase());
}

function itemMatchesSearch(i, q) {
  if (searchScopes.text && matchesQuery(i.text, q)) return true;
  if (searchScopes.author && (matchesQuery(i.handle, q) || matchesQuery(i.author, q))) return true;
  if (searchScopes.tags && (i.tags.some(t => matchesQuery(t, q)) || matchesQuery(i.category, q))) return true;
  return false;
}

// ── Helpers ──
function fmtDuration(s) {
  if (!s) return '';
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function fmtDate(d) {
  if (!d) return '';
  try { return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
  catch { return ''; }
}

/** Project Pages root as pathname (e.g. /x-bookmarks-kids/ or /) so relative assets resolve correctly when the URL has no trailing slash. */
function appBasePath() {
  let p = location.pathname;
  if (p === '/' || p === '') return '/';
  if (p.endsWith('/')) return p;
  if (/\.(html?|[a-z0-9]+)$/i.test(p) && p.lastIndexOf('.') > p.lastIndexOf('/')) {
    return p.replace(/\/[^/]*$/, '/');
  }
  return p + '/';
}

/** Resolve a path from data (e.g. downloads/kids-TV/x.mp4) to a same-origin URL under the app, including GitHub Pages subpath. */
function assetUrl(relative) {
  if (!relative) return '';
  const enc = String(relative)
    .split('/')
    .map(encodeURIComponent)
    .join('/');
  const base = appBasePath();
  if (base === '/') return enc.startsWith('/') ? enc : '/' + enc;
  return base + enc.replace(/^\//, '');
}

function videoSrcEncoded(path) {
  return assetUrl(path);
}

function videoMime(path) {
  const p = (path || '').toLowerCase();
  if (p.endsWith('.webm')) return 'video/webm';
  if (p.endsWith('.mkv')) return 'video/x-matroska';
  return 'video/mp4';
}

function localVideoPartPaths(item) {
  if (!item || !item.has_video) return [];
  if (Array.isArray(item.video_paths) && item.video_paths.length) {
    return item.video_paths;
  }
  if (item.video_path) return [item.video_path];
  return [];
}

function attachLocalVideoPartChain(video, item) {
  if (!video) return;
  const parts = localVideoPartPaths(item);
  if (parts.length <= 1) return;
  let partIdx = 0;
  video.addEventListener('ended', function onPartEnded() {
    partIdx += 1;
    if (partIdx >= parts.length) return;
    const rel = parts[partIdx];
    const vsrc = videoSrcEncoded(rel);
    const vmime = videoMime(rel);
    video.innerHTML = `<source src="${vsrc}" type="${vmime}">`;
    video.load();
    const p = video.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  });
}

function pickRandomFrom(arr) {
  if (!arr || arr.length === 0) return null;
  return arr[Math.floor(Math.random() * arr.length)];
}

function luckyPoolItemsSource() {
  return items.filter(i => itemPassesKidMode(i));
}

function buildLuckyDipPool() {
  const recentSet = new Set(getRecentKeysOrdered());
  return luckyPoolItemsSource().filter(i => !recentSet.has(normUrl(i.url)));
}

function pickFromOldestHalf() {
  const raw = loadJson(LS_RECENT, []);
  if (!Array.isArray(raw) || raw.length === 0) return null;
  const n = raw.length;
  const k = Math.max(1, Math.floor(n / 2));
  const slice = raw.slice(-k);
  const seen = new Set();
  const candidates = [];
  for (const e of slice) {
    const u = normUrl(e && e.u);
    if (!u) continue;
    const it = byNormUrl.get(u);
    if (!it) continue;
    if (!itemPassesKidMode(it)) continue;
    if (seen.has(it.id)) continue;
    seen.add(it.id);
    candidates.push(it);
  }
  return pickRandomFrom(candidates);
}

function pickLuckyDipItem() {
  const pool = buildLuckyDipPool();
  if (pool.length > 0) {
    return { item: pickRandomFrom(pool), hint: '' };
  }
  const fromHalf = pickFromOldestHalf();
  if (fromHalf) {
    return { item: fromHalf, hint: "You've seen these before — here's an older favourite!" };
  }
  const any = pickRandomFrom(luckyPoolItemsSource());
  if (any) {
    return { item: any, hint: "Nothing new right now — here's a pick from the library." };
  }
  return { item: null, hint: '' };
}

function scheduleLuckyDipRecent(url) {
  if (luckyDipRecentTimer) clearTimeout(luckyDipRecentTimer);
  const k = normUrl(url);
  if (!k) return;
  luckyDipRecentTimer = setTimeout(() => {
    luckyDipRecentTimer = null;
    recordRecent(k);
  }, LUCKY_RECENT_MS);
}

function cancelLuckyDipDebounce() {
  if (luckyDipRecentTimer) {
    clearTimeout(luckyDipRecentTimer);
    luckyDipRecentTimer = null;
  }
}

function flushLuckyDipRecent() {
  if (!luckyDipActive) return;
  cancelLuckyDipDebounce();
  const item = items.find(i => i.id === modalOpenItemId);
  if (item) recordRecent(item.url);
}

function endLuckyDipState() {
  cancelLuckyDipDebounce();
  luckyDipActive = false;
  luckyHistory = [];
  luckyHistoryIndex = 0;
  const mod = $('modal');
  if (mod) mod.classList.remove('lucky-dip-immersive');
  const h = $('luckyDipFallbackHint');
  if (h) {
    h.classList.remove('show');
    h.textContent = '';
  }
  const pre = $('luckyPreload');
  if (pre) {
    pre.removeAttribute('src');
  }
}

function syncLuckyDipChrome() {
  if (!luckyDipActive) return;
  const back = $('luckyBack');
  if (back) back.disabled = luckyHistoryIndex <= 0;
}

function scheduleLuckyDipPreload() {
  if (!luckyDipActive) return;
  const pre = $('luckyPreload');
  if (!pre) return;
  const { item } = pickLuckyDipItem();
  const paths = item && item.video_path ? localVideoPartPaths(item) : [];
  const first = paths[0];
  if (first) {
    pre.preload = 'auto';
    pre.src = videoSrcEncoded(first);
  } else {
    pre.removeAttribute('src');
  }
}

function startLuckyDip() {
  const { item, hint } = pickLuckyDipItem();
  if (!item) {
    alert('No bookmarks available for Lucky Dip yet.');
    return;
  }
  luckyDipActive = true;
  luckyHistory = [item.id];
  luckyHistoryIndex = 0;
  const hintEl = $('luckyDipFallbackHint');
  if (hintEl) {
    if (hint) {
      hintEl.textContent = hint;
      hintEl.classList.add('show');
    } else {
      hintEl.classList.remove('show');
      hintEl.textContent = '';
    }
  }
  openItem(item.id, { skipRecent: true });
  queueMicrotask(() => {
    const n = $('luckyNext');
    if (n) n.focus();
  });
}

function luckyDipBack() {
  if (!luckyDipActive) return;
  cancelLuckyDipDebounce();
  if (luckyHistoryIndex <= 0) return;
  luckyHistoryIndex -= 1;
  const h = $('luckyDipFallbackHint');
  if (h) h.classList.remove('show');
  openItem(luckyHistory[luckyHistoryIndex], { skipRecent: true });
}

function luckyDipNext() {
  if (!luckyDipActive) return;
  cancelLuckyDipDebounce();
  if (luckyHistoryIndex < luckyHistory.length - 1) {
    luckyHistory = luckyHistory.slice(0, luckyHistoryIndex + 1);
  }
  const { item, hint } = pickLuckyDipItem();
  if (!item) {
    alert('No more bookmarks available.');
    return;
  }
  const hintEl = $('luckyDipFallbackHint');
  if (hintEl) {
    if (hint) {
      hintEl.textContent = hint;
      hintEl.classList.add('show');
    } else {
      hintEl.classList.remove('show');
      hintEl.textContent = '';
    }
  }
  luckyHistory.push(item.id);
  luckyHistoryIndex = luckyHistory.length - 1;
  openItem(item.id, { skipRecent: true });
}

// ── Category Grid ──
function renderCategories() {
  const grid = $('catGrid');
  pruneStoredUserData();
  const favKeys = loadJson(LS_FAV, []);
  const recentEntries = loadJson(LS_RECENT, []);
  const recentKeys = Array.isArray(recentEntries)
    ? recentEntries.map(e => normUrl(e.u)).filter(Boolean)
    : [];
  const nf = visibleCountFromUrlKeys(favKeys);
  const nr = visibleCountFromUrlKeys(recentKeys);
  const luckyCard = KID_BUILD
    ? `<div class="cat-card" onclick="startLuckyDip()">
      <div class="icon">🎲</div>
      <div class="name">Lucky Dip</div>
      <div class="count">Random</div>
    </div>`
    : '';
  const virtual = `
    <div class="cat-card" onclick="selectCategory('__recent__')">
      <div class="icon">🕐</div>
      <div class="name">Recently viewed</div>
      <div class="count">${nr}</div>
    </div>
    <div class="cat-card" onclick="selectCategory('__fav__')">
      <div class="icon">⭐</div>
      <div class="name">Favourites</div>
      <div class="count">${nf}</div>
    </div>${luckyCard}`;
  grid.innerHTML = virtual + categories.map(c => {
    const hidden = kidMode && !c.kid_safe ? 'hidden' : '';
    return `
      <div class="cat-card ${hidden}" onclick="selectCategory('${c.slug}')">
        <div class="icon">${c.icon}</div>
        <div class="name">${c.name}</div>
        <div class="count">${c.count}</div>
      </div>`;
  }).join('');
}

// ── Items Grid ──
function selectCategory(slug) {
  currentCat = slug;
  if (slug === '__recent__') {
    $('sectionTitle').textContent = '🕐 Recently viewed';
  } else if (slug === '__fav__') {
    $('sectionTitle').textContent = '⭐ Favourites';
  } else {
    const cat = categories.find(c => c.slug === slug);
    if (!cat) return;
    $('sectionTitle').textContent = `${cat.icon} ${cat.name}`;
  }
  $('catGrid').style.display = 'none';
  $('itemsView').style.display = 'block';
  renderItems();
}

function showCategories() {
  currentCat = null;
  $('catGrid').style.display = '';
  $('itemsView').style.display = 'none';
  $('searchInput').value = '';
  searchQuery = '';
  renderCategories();
}

function renderItems() {
  let filtered;
  if (currentCat === '__fav__') {
    const keys = getFavouriteKeys();
    filtered = keys.map(k => byNormUrl.get(k)).filter(Boolean);
  } else if (currentCat === '__recent__') {
    const keys = getRecentKeysOrdered();
    filtered = keys.map(k => byNormUrl.get(k)).filter(Boolean);
  } else {
    filtered = items.filter(i => i.category === currentCat);
  }

  if (kidMode) filtered = filtered.filter(itemPassesKidMode);
  if (searchQuery) {
    filtered = filtered.filter(i => itemMatchesSearch(i, searchQuery));
  }

  $('sectionCount').textContent = `${filtered.length} items`;

  if (filtered.length === 0) {
    $('itemGrid').innerHTML = '';
    $('emptyState').style.display = '';
    return;
  }
  $('emptyState').style.display = 'none';

  const favSet = new Set(getFavouriteKeys());
  $('itemGrid').innerHTML = filtered.map(item => {
    let thumbHtml;
    if (item.thumb_path) {
      thumbHtml = `<img src="${escHtml(assetUrl(item.thumb_path))}" alt="" loading="lazy">`;
    } else {
      const cat = categories.find(c => c.slug === item.category);
      thumbHtml = `<span class="placeholder">${cat ? cat.icon : '📌'}</span>`;
    }
    const playBadge = item.has_video
      ? '<span class="play-badge">▶</span>'
      : '';
    const savedBadge = savedEpisodes.has(item.id)
      ? '<span class="saved-badge">⬇ Saved</span>'
      : '';
    const dur = '';
    const tagHtml = item.tags.map(t => {
      const tc = categories.find(c => c.slug === t);
      return `<span class="tag">${tc ? tc.name : t}</span>`;
    }).join('');
    const fav = favSet.has(normUrl(item.url));

    return `
      <div class="item-card" onclick="openItem(${item.id})">
        <div class="item-thumb">
          ${thumbHtml}${playBadge}${savedBadge}${dur}
          <button type="button" class="item-fav-star${fav ? ' on' : ''}" onclick="toggleFavouriteFromCard(event, ${item.id})" aria-label="Toggle favourite">${fav ? '★' : '☆'}</button>
        </div>
        <div class="item-body">
          <div class="text">${escHtml(item.text || '(no description)')}</div>
          <div class="meta">
            <span>@${escHtml(item.handle)}</span>
            <span>${fmtDate(item.date)}</span>
          </div>
          ${tagHtml ? `<div class="tags">${tagHtml}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function refreshItemGrid() {
  if (currentCat === '__search__') {
    if (searchQuery.length >= 2) {
      const q = searchQuery.toLowerCase();
      const matching = items.filter(i =>
        (!kidMode || !i.risque) &&
        (!kidMode || categories.find(c => c.slug === i.category)?.kid_safe !== false) &&
        itemMatchesSearch(i, q)
      );
      renderSearchResults(matching);
    }
  } else if (currentCat) {
    renderItems();
  }
}

function toggleFavouriteFromCard(ev, id) {
  ev.stopPropagation();
  const item = items.find(i => i.id === id);
  if (!item) return;
  toggleFavourite(item.url);
  refreshItemGrid();
  syncModalFavButton();
}

function toggleFavouriteModal() {
  const item = items.find(i => i.id === modalOpenItemId);
  if (!item) return;
  toggleFavourite(item.url);
  syncModalFavButton();
  refreshItemGrid();
}

function syncModalFavButton() {
  const btn = $('modalFavBtn');
  const item = items.find(i => i.id === modalOpenItemId);
  if (!item) {
    btn.classList.remove('on');
    btn.textContent = '☆';
    return;
  }
  const on = isFavourite(item.url);
  btn.classList.toggle('on', on);
  btn.textContent = on ? '★' : '☆';
}

// ── Open Item ──
function extractTweetId(url) {
  const m = url.match(/\/status\/(\d+)/);
  return m ? m[1] : null;
}

function openItem(id, options = {}) {
  const skipRecent = options.skipRecent === true;
  const item = items.find(i => i.id === id);
  if (!item) return;

  modalOpenItemId = id;
  if (!skipRecent) {
    recordRecent(item.url);
  } else if (luckyDipActive) {
    cancelLuckyDipDebounce();
    scheduleLuckyDipRecent(item.url);
  }

  const modalEl = $('modal');
  if (luckyDipActive) {
    modalEl.classList.add('lucky-dip-immersive');
  } else {
    modalEl.classList.remove('lucky-dip-immersive');
  }

  if (item.has_video && item.video_path) {
    $('modalTitle').textContent = item.text || '';
    $('modalAuthor').textContent = `@${item.handle} · ${fmtDate(item.date)}`;
    $('modalLink').innerHTML = '<span style="color:var(--text-dim);font-size:0.8rem">Local library video</span>';
    const parts = localVideoPartPaths(item);
    const firstPath = parts[0] || item.video_path;
    const vsrc = videoSrcEncoded(firstPath);
    const vmime = videoMime(firstPath);
    $('modalPlayer').innerHTML = '<video controls autoplay playsinline></video>';
    const vEl = $('modalPlayer').querySelector('video');
    vEl.innerHTML = `<source src="${vsrc}" type="${vmime}">`;
    attachLocalVideoPartChain(vEl, item);
    refreshOfflineRow(item);
    syncModalFavButton();
    if (currentCat === '__recent__') renderItems();
    modalEl.classList.add('open');
    hideInstallCard();
    document.body.style.overflow = 'hidden';
    syncLuckyDipChrome();
    if (luckyDipActive) {
      const ann = $('luckyDipAnnouncer');
      if (ann) {
        const t = item.text || 'bookmark';
        ann.textContent = 'Lucky dip — now showing: ' + t.slice(0, 200);
      }
      scheduleLuckyDipPreload();
    }
    return;
  }

  const offlineRowEl = $('offlineRow');
  if (offlineRowEl) offlineRowEl.style.display = 'none';

  const tweetId = extractTweetId(item.url);
  $('modalTitle').textContent = item.text || '';
  $('modalAuthor').textContent = `@${item.handle}`;
  $('modalLink').innerHTML = '';
  syncModalFavButton();
  if (currentCat === '__recent__') renderItems();

  const player = $('modalPlayer');
  player.innerHTML = `<div class="embed-loading"><div class="spinner"></div><p>Loading post…</p></div>`;

  modalEl.classList.add('open');
  hideInstallCard();
  document.body.style.overflow = 'hidden';
  syncLuckyDipChrome();
  if (luckyDipActive) {
    const ann = $('luckyDipAnnouncer');
    if (ann) {
      const t = item.text || 'bookmark';
      ann.textContent = 'Lucky dip — now showing: ' + t.slice(0, 200);
    }
    scheduleLuckyDipPreload();
  }

  if (tweetId && typeof twttr !== 'undefined' && twttr.widgets) {
    player.innerHTML = '';
    twttr.widgets.createTweet(tweetId, player, {
      theme: 'dark',
      align: 'center',
      dnt: true,
      conversation: 'none',
    }).then(el => {
      if (!el) {
        showEmbedFallback(player, item);
      } else {
        // Immediately scan the new widget for iframes to sandbox
        scanForIframes(player);
        // Re-scan after a short delay in case the iframe loads lazily
        setTimeout(() => scanForIframes(player), 500);
        setTimeout(() => scanForIframes(player), 2000);
      }
      $('modalTitle').textContent = '';
      $('modalAuthor').textContent = '';
    }).catch(() => {
      showEmbedFallback(player, item);
    });
  } else {
    showEmbedFallback(player, item);
  }
}

function showEmbedFallback(container, item) {
  const thumbHtml = item.thumb_path
    ? `<img src="${escHtml(assetUrl(item.thumb_path))}" style="max-width:100%;border-radius:8px;margin-bottom:12px">`
    : '';
  container.innerHTML = `<div class="embed-fallback">
    ${thumbHtml}
    <p style="margin-top:8px;color:var(--text);line-height:1.5">${escHtml(item.text || '')}</p>
    <p style="margin-top:12px;font-size:0.8rem">@${escHtml(item.handle)}</p>
  </div>`;
}

function reallyCloseModal() {
  if (luckyDipActive) {
    flushLuckyDipRecent();
  }
  endLuckyDipState();
  modalOpenItemId = null;
  const modalEl = $('modal');
  modalEl.classList.remove('open');
  modalEl.classList.remove('lucky-dip-immersive');
  $('modalPlayer').innerHTML = '';
  $('modalTitle').textContent = '';
  $('modalAuthor').textContent = '';
  $('modalLink').innerHTML = '';
  document.body.style.overflow = '';
  // The install card suppresses itself while the player is open; retry once it closes.
  if (!installCardShown) setTimeout(showInstallCard, 1200);
}

function closeModal() {
  if (document.fullscreenElement) {
    const p = document.exitFullscreen();
    if (p && typeof p.then === 'function') {
      p.then(() => reallyCloseModal()).catch(() => reallyCloseModal());
    } else {
      reallyCloseModal();
    }
    return;
  }
  reallyCloseModal();
}

// ── Events ──
$('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  if (currentCat && currentCat !== '__search__') {
    renderItems();
  } else {
    if (searchQuery.length >= 2) {
      const q = searchQuery.toLowerCase();
      const matching = items.filter(i =>
        (!kidMode || !i.risque) &&
        (!kidMode || categories.find(c => c.slug === i.category)?.kid_safe !== false) &&
        itemMatchesSearch(i, q)
      );
      currentCat = '__search__';
      $('sectionTitle').textContent = '🔍 Search Results';
      $('catGrid').style.display = 'none';
      $('itemsView').style.display = 'block';
      renderSearchResults(matching);
    } else {
      if (currentCat === '__search__') showCategories();
    }
  }
});

function renderSearchResults(filtered) {
  $('sectionCount').textContent = `${filtered.length} results`;
  if (filtered.length === 0) {
    $('itemGrid').innerHTML = '';
    $('emptyState').style.display = '';
    return;
  }
  $('emptyState').style.display = 'none';
  const favSet = new Set(getFavouriteKeys());
  $('itemGrid').innerHTML = filtered.map(item => {
    const cat = categories.find(c => c.slug === item.category);
    let thumbHtml;
    if (item.thumb_path) {
      thumbHtml = `<img src="${escHtml(assetUrl(item.thumb_path))}" alt="" loading="lazy">`;
    } else {
      thumbHtml = `<span class="placeholder">${cat ? cat.icon : '📌'}</span>`;
    }
    const playBadge = item.has_video
      ? '<span class="play-badge">▶</span>'
      : '';
    const savedBadge = savedEpisodes.has(item.id)
      ? '<span class="saved-badge">⬇ Saved</span>'
      : '';
    const fav = favSet.has(normUrl(item.url));
    return `
      <div class="item-card" onclick="openItem(${item.id})">
        <div class="item-thumb">${thumbHtml}${playBadge}${savedBadge}
          <button type="button" class="item-fav-star${fav ? ' on' : ''}" onclick="toggleFavouriteFromCard(event, ${item.id})" aria-label="Toggle favourite">${fav ? '★' : '☆'}</button>
        </div>
        <div class="item-body">
          <div class="text">${escHtml(item.text || '(no description)')}</div>
          <div class="meta">
            <span>@${escHtml(item.handle)} · ${cat ? cat.name : ''}</span>
            <span>${fmtDate(item.date)}</span>
          </div>
        </div>
      </div>`;
  }).join('');
}

const kidModeEl = $('kidMode');
if (kidModeEl && kidModeEl.tagName === 'INPUT' && kidModeEl.type === 'checkbox') {
  kidModeEl.addEventListener('change', e => {
    kidMode = e.target.checked;
    if (currentCat && currentCat !== '__search__') {
      const cat = categories.find(c => c.slug === currentCat);
      if (cat && !cat.kid_safe) showCategories();
      else renderItems();
    } else {
      showCategories();
    }
  });
}

$('modal').addEventListener('click', e => {
  if (e.target === $('modal')) closeModal();
});

document.addEventListener('keydown', e => {
  if (!$('modal').classList.contains('open')) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    closeModal();
    return;
  }
  if (!luckyDipActive) return;
  const t = e.target;
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  if (e.key === 'ArrowRight' || e.key === 'n' || e.key === 'N') {
    if (typing) return;
    e.preventDefault();
    luckyDipNext();
    return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'p' || e.key === 'P') {
    if (typing) return;
    e.preventDefault();
    luckyDipBack();
  }
});

// ── Aggressive iframe lockdown ──
// Twitter's embed creates iframes inside shadow DOM. We forced shadow DOM
// open (in the <head> script) so we can now reach in and sandbox them.
const SAFE_SANDBOX = 'allow-scripts allow-same-origin allow-forms';

function sandboxIframe(iframe) {
  if (iframe._locked) return;
  iframe.setAttribute('sandbox', SAFE_SANDBOX);
  iframe._locked = true;
}

function scanForIframes(root) {
  // Find all iframes in this root
  root.querySelectorAll?.('iframe')?.forEach(sandboxIframe);
  // Traverse into any open shadow roots
  root.querySelectorAll?.('*')?.forEach(el => {
    if (el.shadowRoot) {
      scanForIframes(el.shadowRoot);
      // Also observe inside shadow roots for dynamically added iframes
      observeRoot(el.shadowRoot);
    }
  });
}

const observedRoots = new WeakSet();

function observeRoot(root) {
  if (observedRoots.has(root)) return;
  observedRoots.add(root);
  const obs = new MutationObserver(() => scanForIframes(root));
  obs.observe(root, { childList: true, subtree: true });
}

// Observe the main document
observeRoot(document.body);

// Periodic fallback scan — catches anything MutationObserver missed
setInterval(() => scanForIframes(document.body), 1500);

// Block ALL link clicks to X domains on the parent page
document.addEventListener('click', e => {
  const a = e.target.closest('a');
  if (!a) return;
  const href = a.getAttribute('href') || '';
  if (href.includes('twitter.com') || href.includes('x.com') || href.includes('t.co')) {
    e.preventDefault();
    e.stopPropagation();
  }
}, true);

// ── Offline episodes ──
// Videos live in a cache the service worker reads from. Downloading happens here in
// the page rather than in the worker so progress can be streamed to the UI, and so a
// closed tab cannot leave a half-written entry behind.

const VIDEO_CACHE = 'kids-videos-v1';
const savedEpisodes = new Set();   // ids known to be fully cached
let offlineBusyId = null;

function offlineSupported() {
  return 'serviceWorker' in navigator && 'caches' in window;
}

function itemOfflineUrls(item) {
  return localVideoPartPaths(item).map(p => assetUrl(p));
}

async function isEpisodeSaved(item) {
  if (!offlineSupported()) return false;
  const urls = itemOfflineUrls(item);
  if (!urls.length) return false;
  try {
    const cache = await caches.open(VIDEO_CACHE);
    for (const u of urls) {
      const hit = await cache.match(u, { ignoreVary: true, ignoreSearch: true });
      if (!hit) return false;
    }
    return true;
  } catch (err) {
    return false;
  }
}

function fmtMB(bytes) {
  if (!bytes) return '';
  const mb = bytes / (1024 * 1024);
  return mb >= 1024 ? `${(mb / 1024).toFixed(1)} GB` : `${Math.round(mb)} MB`;
}

async function saveEpisodeOffline(item, onProgress) {
  const cache = await caches.open(VIDEO_CACHE);
  const urls = itemOfflineUrls(item);

  // Size everything first so the progress bar is honest rather than per-part jumpy.
  const sizes = [];
  let total = 0;
  for (const u of urls) {
    let len = 0;
    try {
      const head = await fetch(u, { method: 'HEAD' });
      len = parseInt(head.headers.get('content-length') || '0', 10) || 0;
    } catch (err) { /* fall back to counting bytes as they arrive */ }
    sizes.push(len);
    total += len;
  }

  let doneBytes = 0;
  for (let i = 0; i < urls.length; i++) {
    const url = urls[i];
    if (await cache.match(url, { ignoreVary: true, ignoreSearch: true })) {
      doneBytes += sizes[i];
      onProgress(doneBytes, total, i + 1, urls.length);
      continue;
    }

    const res = await fetch(url);
    if (!res.ok) throw new Error(`${res.status} fetching part ${i + 1}`);

    // Stream so progress moves during a 70MB part, then rebuild a cacheable Response.
    const reader = res.body && res.body.getReader ? res.body.getReader() : null;
    let stored;
    if (reader) {
      const chunks = [];
      const startBytes = doneBytes;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        doneBytes += value.length;
        onProgress(doneBytes, total, i + 1, urls.length);
      }
      const blob = new Blob(chunks, { type: res.headers.get('Content-Type') || 'video/mp4' });
      if (!total) doneBytes = startBytes + blob.size;
      stored = new Response(blob, {
        status: 200,
        headers: {
          'Content-Type': res.headers.get('Content-Type') || 'video/mp4',
          'Content-Length': String(blob.size),
          'Accept-Ranges': 'bytes',
        },
      });
    } else {
      stored = res.clone();
      doneBytes += sizes[i];
      onProgress(doneBytes, total, i + 1, urls.length);
    }

    await cache.put(url, stored);
  }

  savedEpisodes.add(item.id);
  return total || doneBytes;
}

async function removeEpisodeOffline(item) {
  const cache = await caches.open(VIDEO_CACHE);
  for (const u of itemOfflineUrls(item)) {
    await cache.delete(u, { ignoreVary: true, ignoreSearch: true });
  }
  savedEpisodes.delete(item.id);
}

async function storageNote() {
  if (!navigator.storage || !navigator.storage.estimate) return '';
  try {
    const { usage, quota } = await navigator.storage.estimate();
    if (!usage) return '';
    const pct = quota ? ` of ${fmtMB(quota)}` : '';
    return `Using ${fmtMB(usage)}${pct} on this device`;
  } catch (err) {
    return '';
  }
}

function setOfflineUI({ label, saved, busy, note, progress }) {
  const btn = $('offlineBtn');
  const bar = $('offlineProgress');
  const noteEl = $('offlineNote');
  if (!btn) return;
  btn.textContent = label;
  btn.disabled = !!busy;
  btn.classList.toggle('saved', !!saved);
  noteEl.textContent = note || '';
  if (typeof progress === 'number') {
    bar.classList.add('on');
    bar.firstElementChild.style.width = `${Math.max(0, Math.min(100, progress))}%`;
  } else {
    bar.classList.remove('on');
    bar.firstElementChild.style.width = '0%';
  }
}

async function refreshOfflineRow(item) {
  const row = $('offlineRow');
  if (!row) return;
  const isLocalVideo = item && item.has_video && item.video_path && itemOfflineUrls(item).length;
  if (!isLocalVideo || !offlineSupported()) {
    row.style.display = 'none';
    return;
  }
  row.style.display = '';
  const saved = await isEpisodeSaved(item);
  if (saved) savedEpisodes.add(item.id); else savedEpisodes.delete(item.id);
  const parts = itemOfflineUrls(item).length;
  setOfflineUI({
    label: saved ? '✓ Saved — tap to remove' : '⬇ Save for offline',
    saved,
    busy: offlineBusyId === item.id,
    note: saved ? await storageNote() : `${parts} part${parts === 1 ? '' : 's'}`,
  });
}

async function toggleOfflineForCurrent() {
  const item = items.find(i => i.id === modalOpenItemId);
  if (!item || offlineBusyId !== null) return;

  if (savedEpisodes.has(item.id)) {
    offlineBusyId = item.id;
    setOfflineUI({ label: 'Removing…', busy: true });
    try {
      await removeEpisodeOffline(item);
    } finally {
      offlineBusyId = null;
    }
    await refreshOfflineRow(item);
    renderItems();
    return;
  }

  offlineBusyId = item.id;
  try {
    if (navigator.storage && navigator.storage.persist) {
      // Without this the browser may evict the episode under storage pressure.
      try { await navigator.storage.persist(); } catch (err) { /* best effort */ }
    }
    setOfflineUI({ label: 'Saving…', busy: true, progress: 0, note: 'Starting…' });
    await saveEpisodeOffline(item, (done, total, partNo, partCount) => {
      const pct = total ? (done / total) * 100 : 0;
      setOfflineUI({
        label: 'Saving…',
        busy: true,
        progress: pct,
        note: `Part ${partNo} of ${partCount} — ${fmtMB(done)}${total ? ` of ${fmtMB(total)}` : ''}`,
      });
    });
  } catch (err) {
    console.warn('[offline] save failed', err);
    setOfflineUI({ label: '⬇ Save for offline', note: 'Could not save — check your connection' });
    offlineBusyId = null;
    return;
  }
  offlineBusyId = null;
  await refreshOfflineRow(item);
  renderItems();
}

/** Mark already-saved episodes on the cards, without blocking the render. */
async function markSavedCards() {
  if (!offlineSupported()) return;
  const locals = items.filter(i => i.has_video && i.video_path && itemOfflineUrls(i).length);
  for (const it of locals) {
    if (await isEpisodeSaved(it)) savedEpisodes.add(it.id);
  }
  if (savedEpisodes.size) renderItems();
}

function syncOnlineState() {
  document.body.classList.toggle('is-offline', !navigator.onLine);
}
window.addEventListener('online', syncOnlineState);
window.addEventListener('offline', syncOnlineState);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const sw = reg.installing;
        if (!sw) return;
        sw.addEventListener('statechange', () => {
          if (sw.state === 'installed' && navigator.serviceWorker.controller) {
            sw.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
    }).catch(err => console.warn('[sw] registration failed', err));
  });
}

// ── Install prompt ──
// Chrome fires beforeinstallprompt and lets us call prompt() later. iOS Safari has no
// such API, so it gets the Share-sheet instructions instead. Either way the card waits
// until the child has actually used the app, and stays hidden while a video is open.

const LS_INSTALL_DISMISSED = 'playboxInstallDismissed';
const INSTALL_SNOOZE_DAYS = 30;
const INSTALL_DELAY_MS = 20000;

let deferredInstallPrompt = null;
let installCardShown = false;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}

function isIOSSafari() {
  const ua = navigator.userAgent;
  const iOS = /iPad|iPhone|iPod/.test(ua)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS 13+
  const webkit = /WebKit/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  return iOS && webkit;
}

function installSnoozed() {
  try {
    const raw = localStorage.getItem(LS_INSTALL_DISMISSED);
    if (!raw) return false;
    const when = parseInt(raw, 10);
    if (!Number.isFinite(when)) return false;
    return (Date.now() - when) < INSTALL_SNOOZE_DAYS * 24 * 60 * 60 * 1000;
  } catch (err) {
    return false;
  }
}

function hideInstallCard() {
  const card = $('installCard');
  if (!card) return;
  card.classList.remove('show');
  setTimeout(() => { if (!card.classList.contains('show')) card.hidden = true; }, 400);
}

function showInstallCard() {
  const card = $('installCard');
  if (!card || installCardShown) return;
  if (isStandalone() || installSnoozed()) return;
  // Never cover the player.
  if ($('modal') && $('modal').classList.contains('open')) return;
  if (!deferredInstallPrompt && !isIOSSafari()) return;

  card.classList.toggle('ios', !deferredInstallPrompt && isIOSSafari());
  card.hidden = false;
  // Next frame, so the transition runs from the off-screen position. rAF is throttled
  // in background tabs, so a timer backstops it — otherwise the card would sit
  // un-hidden at opacity 0: invisible, but still announced by screen readers.
  const reveal = () => card.classList.add('show');
  requestAnimationFrame(reveal);
  setTimeout(reveal, 60);
  installCardShown = true;
}

function dismissInstall() {
  try { localStorage.setItem(LS_INSTALL_DISMISSED, String(Date.now())); } catch (err) { /* private mode */ }
  hideInstallCard();
}

async function acceptInstall() {
  if (!deferredInstallPrompt) { dismissInstall(); return; }
  const prompt = deferredInstallPrompt;
  deferredInstallPrompt = null;
  hideInstallCard();
  try {
    prompt.prompt();
    const { outcome } = await prompt.userChoice;
    // A dismissal here is a real "no" — snooze so we do not nag on every visit.
    if (outcome !== 'accepted') dismissInstall();
  } catch (err) {
    console.warn('[install] prompt failed', err);
  }
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();               // suppress Chrome's own mini-infobar
  deferredInstallPrompt = e;
  setTimeout(showInstallCard, INSTALL_DELAY_MS);
});

window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  try { localStorage.removeItem(LS_INSTALL_DISMISSED); } catch (err) { /* ignore */ }
  hideInstallCard();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && $('installCard') && !$('installCard').hidden) dismissInstall();
});

if (isIOSSafari()) setTimeout(showInstallCard, INSTALL_DELAY_MS);

// ── Init ──
renderCategories();
syncOnlineState();
markSavedCards();
</script>
</body>
</html>
